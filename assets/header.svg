<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#160206"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="45%">
      <stop offset="0" stop-color="#ff1a2e" stop-opacity=".42"/><stop offset="1" stop-color="#ff1a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4b58"/><stop offset=".5" stop-color="#e50914"/><stop offset="1" stop-color="#8a0010"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505" stop-opacity="1"/><stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="logoClip"><text x="600" y="232" text-anchor="middle" class="logo">RED</text></clipPath>
    <clipPath id="frame"><rect width="1200" height="420" rx="18"/></clipPath>
    <style>
      .logo{font:italic 900 190px Impact,'Arial Black','Segoe UI Black',sans-serif;letter-spacing:8px}
      .sub{font:700 22px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:12px;fill:#f4f4f4}
      .mono{font:600 14px Consolas,'Courier New',monospace;fill:#ff4d5a;letter-spacing:3px}
      .tag{font:600 14px Consolas,'Courier New',monospace;fill:#a9a9a9;letter-spacing:3px}
      .hl{animation:hl 3s linear infinite}
      @keyframes hl{from{transform:translateY(0)}to{transform:translateY(36px)}}
      .pulse{animation:pulse 4s ease-in-out infinite;transform-origin:600px 200px}
      @keyframes pulse{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
      .g1{animation:g1 3.4s steps(1) infinite}.g2{animation:g2 3.4s steps(1) infinite}
      @keyframes g1{0%,85%,100%{transform:translate(0,0);opacity:0}87%{transform:translate(-10px,3px);opacity:.85}90%{transform:translate(8px,-2px);opacity:.85}93%{transform:translate(-4px,0);opacity:.85}96%{opacity:0}}
      @keyframes g2{0%,85%,100%{transform:translate(0,0);opacity:0}87%{transform:translate(9px,-3px);opacity:.75}90%{transform:translate(-7px,2px);opacity:.75}93%{transform:translate(5px,1px);opacity:.75}96%{opacity:0}}
      .main{animation:jit 3.4s steps(1) infinite}
      @keyframes jit{0%,85%,100%{transform:none}88%{transform:translateX(5px)}91%{transform:translateX(-4px)}94%{transform:none}}
      .sweep{animation:sweep 4.5s ease-in-out infinite}
      @keyframes sweep{0%{transform:translateX(-500px) skewX(-20deg)}55%,100%{transform:translateX(700px) skewX(-20deg)}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(440px)}}
      .rise{opacity:0;animation:rise 1.2s .3s cubic-bezier(.2,.8,.2,1) forwards}
      .rise2{opacity:0;animation:rise 1.2s .9s cubic-bezier(.2,.8,.2,1) forwards}
      .rise3{opacity:0;animation:rise 1.2s 1.4s cubic-bezier(.2,.8,.2,1) forwards}
      @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
      .p{animation-name:float;animation-timing-function:linear;animation-iteration-count:infinite;opacity:0}
      @keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-440px);opacity:0}}
      .blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
      .ring{animation:spin 24s linear infinite;transform-origin:600px 200px}
      .ring2{animation:spin 34s linear infinite reverse;transform-origin:600px 200px}
      @keyframes spin{to{transform:rotate(360deg)}}
      .bar{animation:eq 1.1s ease-in-out infinite alternate;transform-origin:50% 100%;transform-box:fill-box}
      @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="1200" height="420" fill="url(#bg)"/>
  <!-- synthwave floor -->
  <g stroke="#ff1a2e" stroke-opacity=".35" stroke-width="1.2">
    <path d="M600 270L-600 440M600 270L-300 440M600 270L0 440M600 270L200 440M600 270L400 440M600 270L520 440M600 270L680 440M600 270L800 440M600 270L1000 440M600 270L1200 440M600 270L1500 440M600 270L1800 440"/>
    <g class="hl">
      <path d="M0 270H1200M0 282H1200M0 298H1200M0 318H1200M0 344H1200M0 378H1200M0 418H1200"/>
      <path d="M0 234H1200M0 246H1200M0 262H1200" />
    </g>
  </g>
  <rect width="1200" height="290" fill="url(#bg)"/>
  <rect y="268" width="1200" height="40" fill="url(#fade)"/>
  <rect width="1200" height="420" fill="url(#glow)" class="pulse"/>
  <!-- rotating rings -->
  <g fill="none" stroke="#ff1a2e">
    <circle class="ring" cx="600" cy="200" r="170" stroke-dasharray="3 13" stroke-width="2" stroke-opacity=".45"/>
    <circle class="ring2" cx="600" cy="200" r="192" stroke-dasharray="140 40 12 40" stroke-width="1.2" stroke-opacity=".3"/>
  </g>
  <!-- particles -->
  <g fill="#ff2a3a">
    <circle class="p" cx="120" cy="430" r="2" style="animation-duration:7s"/>
    <circle class="p" cx="240" cy="430" r="1.5" style="animation-duration:9s;animation-delay:2s"/>
    <circle class="p" cx="340" cy="430" r="2.5" style="animation-duration:6s;animation-delay:1s"/>
    <circle class="p" cx="460" cy="430" r="1.5" style="animation-duration:10s;animation-delay:3s"/>
    <circle class="p" cx="760" cy="430" r="2" style="animation-duration:8s;animation-delay:.5s"/>
    <circle class="p" cx="880" cy="430" r="1.5" style="animation-duration:7.5s;animation-delay:4s"/>
    <circle class="p" cx="990" cy="430" r="2.5" style="animation-duration:9.5s;animation-delay:1.5s"/>
    <circle class="p" cx="1090" cy="430" r="1.8" style="animation-duration:6.5s;animation-delay:2.5s"/>
    <circle class="p" cx="60" cy="430" r="1.2" style="animation-duration:11s;animation-delay:5s"/>
    <circle class="p" cx="1150" cy="430" r="1.2" style="animation-duration:10s;animation-delay:.2s"/>
    <circle class="p" cx="560" cy="430" r="1.4" style="animation-duration:8.5s;animation-delay:3.5s"/>
    <circle class="p" cx="660" cy="430" r="1.8" style="animation-duration:7.2s;animation-delay:6s"/>
  </g>
  <!-- logo -->
  <g class="rise">
    <text x="600" y="232" text-anchor="middle" class="logo g1" fill="#00e5ff">RED</text>
    <text x="600" y="232" text-anchor="middle" class="logo g2" fill="#ff00aa">RED</text>
    <g class="main" filter="url(#neon)"><text x="600" y="232" text-anchor="middle" class="logo" fill="url(#red)">RED</text></g>
    <g clip-path="url(#logoClip)"><rect class="sweep" x="400" y="40" width="120" height="240" fill="url(#shine)"/></g>
  </g>
  <g class="rise2"><text id="profile-name" x="600" y="296" text-anchor="middle" class="sub">R CADACH · FULL-STACK BUILDER</text></g>
  <g class="rise3"><text x="600" y="330" text-anchor="middle" class="tag">AI AGENTS  ◆  DESKTOP APPS  ◆  ERP SYSTEMS  ◆  INFRA</text></g>
  <!-- HUD -->
  <g stroke="#ff1a2e" stroke-width="2" fill="none" opacity=".85">
    <path d="M28 68V28H68"/><path d="M1132 28H1172V68"/><path d="M28 352V392H68"/><path d="M1172 352V392H1132"/>
  </g>
  <text x="46" y="56" class="mono">SYS://REEDONEE</text>
  <text x="1154" y="56" text-anchor="end" class="mono">STATUS: <tspan fill="#3dff7a">ONLINE</tspan><tspan class="blink" fill="#3dff7a"> ●</tspan></text>
  <text x="46" y="380" class="mono">&gt; profile.boot()<tspan class="blink">_</tspan></text>
  <g transform="translate(1072 382)" fill="#ff1a2e">
    <rect class="bar" x="0" y="-26" width="6" height="26"/>
    <rect class="bar" x="10" y="-26" width="6" height="26" style="animation-delay:.2s"/>
    <rect class="bar" x="20" y="-26" width="6" height="26" style="animation-delay:.4s"/>
    <rect class="bar" x="30" y="-26" width="6" height="26" style="animation-delay:.1s"/>
    <rect class="bar" x="40" y="-26" width="6" height="26" style="animation-delay:.3s"/>
    <rect class="bar" x="50" y="-26" width="6" height="26" style="animation-delay:.5s"/>
    <rect class="bar" x="60" y="-26" width="6" height="26" style="animation-delay:.15s"/>
    <rect class="bar" x="70" y="-26" width="6" height="26" style="animation-delay:.35s"/>
  </g>
  <rect class="scan" width="1200" height="2" fill="#ff1a2e" opacity=".22"/>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#ff1a2e" stroke-opacity=".4"/>
</svg>
