<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111114"/><stop offset="1" stop-color="#0a0a0b"/></linearGradient>
<radialGradient id="gl" cx="100%" cy="0%" r="80%"><stop offset="0" stop-color="#ff1a2e" stop-opacity=".28"/><stop offset="1" stop-color="#ff1a2e" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="418" height="198" rx="14"/></clipPath>
<style>
.h{font:800 24px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:.5px}
.d{font:400 14.5px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#b8b8bd}
.tg{font:600 11.5px Consolas,'Courier New',monospace;fill:#ff6b75}
.lg{font:600 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9a9aa0}
.bd{font:700 10px Consolas,'Courier New',monospace;fill:#ff1a2e;letter-spacing:1.5px}
.dash{stroke-dasharray:120 1100;animation:run 5s linear 0s infinite}@keyframes run{to{stroke-dashoffset:-1220}}
.sw{animation:sw 5s ease-in-out 0s infinite}@keyframes sw{0%{transform:translateX(-300px) skewX(-20deg)}50%,100%{transform:translateX(560px) skewX(-20deg)}}
.pl{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}
.in{opacity:0;animation:in .8s 0.20s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style></defs>
<g clip-path="url(#c)">
<rect width="420" height="200" fill="url(#bg)"/><rect width="420" height="200" fill="url(#gl)"/>
<rect class="sw" x="0" y="-20" width="140" height="240" fill="url(#sh)"/>
</g>
<rect x="1" y="1" width="418" height="198" rx="14" fill="none" stroke="#26262b" stroke-width="1.5"/>
<rect class="dash" x="1" y="1" width="418" height="198" rx="14" fill="none" stroke="#ff1a2e" stroke-width="2"/>
<g class="in">
<rect x="26" y="26" width="4" height="30" rx="2" fill="#ff1a2e"/>
<text x="40" y="51" class="h">ORCH</text>
<rect x="328" y="28" width="66" height="20" rx="10" fill="none" stroke="#ff1a2e" stroke-opacity=".6"/>
<text x="361" y="42" text-anchor="middle" class="bd">PUBLIC</text>
<text x="26" y="98" class="d">Voice-controlled multi-agent desktop workspace.</text><text x="26" y="120" class="d">Hold Ctrl+E, speak — agents spawn, code, build,</text><text x="26" y="142" class="d">deploy on an infinite canvas. Fully local.</text>
<rect x="26" y="160" width="54" height="22" rx="11" fill="#1a0306" stroke="#4a0a12"/><text x="53" y="175" text-anchor="middle" class="tg">voice</text><rect x="88.0" y="160" width="61" height="22" rx="11" fill="#1a0306" stroke="#4a0a12"/><text x="119" y="175" text-anchor="middle" class="tg">agents</text><rect x="157.2" y="160" width="68" height="22" rx="11" fill="#1a0306" stroke="#4a0a12"/><text x="191" y="175" text-anchor="middle" class="tg">STT/TTS</text>
<circle cx="310" cy="171" r="6" fill="#3178c6"/>
<text x="322" y="175" class="lg">TypeScript</text>
<text x="394" y="176" text-anchor="end" font-size="16" fill="#ff1a2e">↗</text>
</g>
</svg>